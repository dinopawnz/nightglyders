  ==============================================================================================================================
  NIGHTGLYDERS - THE NIGHTGLYDER TREE + THE HOLLOW (Roost Rush)   v2   -  Otherside MML
  ==============================================================================================================================
  A colossal glowing world-tree (about 330 m tall) on a floating island under its own night sky. Every visible thing is a GLB
  made for this build (Meshy: trunk, crown, boughs, canopy, decks, treehouse pods, the lodge, hammock cots, rope bridges,
  lanterns, the seed-pod elevator, hearths, moths, critters, lily pads, mushroom roosts). NO PRIMITIVES AT ALL: every collider
  is an invisible copy of a real model (SHOW_PADS = true or the "pads" command shows them).
  Models + sounds load from BASE (meshopt + gzip .glb.gz; bump VER after re-uploading anything).

  PLACEMENT: place the document where the island's FRONT EDGE should be. The lantern path runs from there to the tree's gate.
    * THE ISLAND     giant glowing mushroom groves, plants, critters (click one), the lantern path, the title.
    * THE TREE       a hollow trunk with arched windows, great surface roots, boughs spreading 140 m, a canopy 450 m wide.
    * ROOT HALL      inside the gate: hearths, hammock cots, the elevator.
    * THE ELEVATOR   a woven seed pod up the hollow heart: The Hollow (cave) - Root Hall - Hearth Ring - Glyder Village.
                     Click a hanging lantern beside the shaft to call it; inside, click a floor's name.
                     Rope bridges cross the hollow trunk from the shaft to the doorways of the decks.
    * HEARTH RING    (82 m) a deck round the trunk: rows of hammock cots, hearths.
    * GLYDER VILLAGE (160 m) a deck with a meeting hall; treehouse pods hang under the boughs all round.
    * THE CROWN      (239 m) the Glyder Lodge in the bowl of the crown - reached by the GLYDE ROUTE.
    * THE GLYDE ROUTE  three pairs of giant branches: walk up one, hop onto the branch that dips down beside its tip, walk up that
                     one to the next deck. EVERY branch on the tree LIGHTS UP when you touch it, plays a note (higher up = higher
                     note) and lets a few glowing moths fly. Click a hearth's fire: the whole tree sings, crown to roots.
    * THE HOLLOW     the cave inside the island. Take the pod down, cross the rope bridges to ROOST RUSH on the lily pads over the
                     glowing basin. Fall in? The spiral root stair climbs back out.

  ROOST RUSH (the cave game): crews stand on the lily pads. While the music plays, glyde around. When it stops, a few LIT mushroom
  roosts rise between the pads - get on one before the pads DROP into the basin. Anyone not on a lit roost falls (out).
  Fewer roosts every round. The last crew with anyone standing wins (or the crew with the most standing after MAX_ROUNDS).

  TEAMS - WHEN COMBINING WITH THE EVENT (same hook as Deep Freeze):
    "play" opens crew picking by quarter of the arena (RED front-left, TEAL front-right, MUSTARD back-left, CREAM back-right;
    front = toward the island's front edge). To use the event's own teams, fill G.rematch = { connectionId: crew } (or the
    "teams {json}" command) and send "start". "rematch" = same crews again. Each player's crew shows as a coloured moth over them.

  HOST: <HOST_CODE> <command> typed into the placer lantern (before build), the host mushroom at the island's front edge, or the
  hidden m-prompt id "ng-host"; board group id "ng-remote" carries data-ack / data-game / data-players / data-out.
    build | unbuild | play | start | stop | end | again | rematch | teams {json} | rounds <n> | music on|off|up|down | lite [on|off] |
    show (the tree sings) | lift cave|roots|hearth|village | refresh | yard here|show | remote | pads (show colliders)
  Messages OUT (data-out): {type:"result", game:"roostrush", rank:[crew...], crews:{...}}
-->

      if (!ahead.length) { E.dir = -E.dir; ahead = ks.filter((k) => (k - E.at) * E.dir > 0); }
      const next = ahead.sort((a, b) => Math.abs(a - E.at) - Math.abs(b - E.at))[0];
      const tok = ++E.tok; E.busy = true; E.deadline = now() + moveMs(E.at, next) + DWELL + 8000;
      const go = () => {
        if (E.tok !== tok) return;
        const ms = moveMs(E.at, next), from = PODY(E.at), to = PODY(next);
        const crosses = (Math.min(E.at, next) <= ROOTS && Math.max(E.at, next) >= ROOTS);
        if (crosses) lid(true);
        const startGo = () => {
          if (E.tok !== tok) return;
          glide(POD, "y", from, to, ms, "easeInOutSine");
          const r0 = 90 - EV.stops[E.at][2], r1 = 90 - EV.stops[next][2];
          let d = ((r1 - r0) % 360 + 540) % 360 - 180;
          glide(TURN, "ry", r0, r0 + d, ms, "easeInOutSine");
          const h = loopSound("ng_lift_hum.mp3", 0, 1.5, 0, 0.5, 4000, hum);
          later(ms, () => {
            h.remove(); if (E.tok !== tok) return;
            E.at = next; E.req.delete(next); const l = LAND[next]; if (l.glow) { l.glow.remove(); l.glow = null; }
            if (next !== ROOTS) lid(false);
            doors(true, next); sfx("ng_lift_chime.mp3", 0, STOPS[next] + 2, 3, 0.7);
            later(DWELL, () => { if (E.tok !== tok) return; E.busy = false; if (E.req.size) { doors(false, E.at); later(1100, pump); } });
          });
        };
        if (crosses && E.at !== ROOTS) later(2300, startGo); else startGo();
      };
      if (E.open) { doors(false, E.at); later(1100, go); } else go();
    }
    every(3000, () => { if (E.busy && now() > E.deadline) { E.tok++; E.busy = false; const y = PODY(E.at); glide(POD, "y", y, y, 1); doors(true, E.at); lid(E.at === ROOTS); hostMsg("ELEVATOR HEALED AT " + EV.stops[E.at][0].toUpperCase()); pump(); } });
    lid(true); doors(true, E.at);

    // ==========================================================
    // ROOST RUSH (the cave game)
    // ==========================================================
    const ARENA = el("m-group", { x: AC[0], z: AC[1] }, STAGE);
    const PADY = CF - A.pad_top * A.pad_s;
    const PET = A.petals.map(([x, z, a]) => {
      const g = el("m-group", { x: x - AC[0], y: PADY, z: z - AC[1], ry: a }, ARENA);
      model("glow_pad", S3(A.pad_s), g);
      return { g, col: colModel("glow_pad_col", S3(A.pad_s), g) };
    });
    const PERCH_LO = CF - A.perch_top * A.perch_s - 9, PERCH_HI = CF + 1.2 - A.perch_top * A.perch_s;
    const PERCH = A.perches.map(([x, z], i) => {
      const g = el("m-group", { x: x - AC[0], y: PERCH_LO, z: z - AC[1], ry: i * 47 }, ARENA); model("roost_perch", S3(A.perch_s), g);
      return { i, x, z, g, lit: null, pad: null, up: false };
    });
    // the boards over the arena (four faces): a word + a number
    const BOARDS = [0, 90, 180, 270].map((a) => { const [x, z] = polar(a, 4); const g = el("m-group", { x, y: CF + 17, z, ry: a }, ARENA);
      return { word: el("m-group", {}, g), num: el("m-group", { y: -2.6 }, g) }; });
    let wordNow = "", numNow = "";
    function boardWord(w) { if (w === wordNow) return; wordNow = w; BOARDS.forEach((b) => { while (b.word.firstChild) b.word.firstChild.remove(); if (w) model(w, S3(2.0), b.word); }); }
    function boardNum(n) { const s = n === null || n === undefined ? "" : String(clamp(n, 0, 99)); if (s === numNow) return; numNow = s;
      BOARDS.forEach((b) => { while (b.num.firstChild) b.num.firstChild.remove(); s.split("").forEach((ch, i) => model("wd_d" + ch, Object.assign({ x: (i - (s.length - 1) / 2) * 1.5 }, S3(2.2)), b.num)); }); }
    boardWord("wd_roostrush");
    const MUSIC = el("m-group", {}, ARENA);
    function musicOn() { musicOff(); if (!G.music) return; [[22, 0], [-22, 0], [0, 22], [0, -22]].forEach(([x, z]) => loopSound("ng_rr_music.mp3", x, CF + 6, z, 0.55 * G.vol, MUSIC_MS, MUSIC)); }
    function musicOff() { while (MUSIC.firstChild) MUSIC.firstChild.remove(); }

    const G = { ph: "idle", round: 0, crews: {}, elim: [], pts: {}, timers: [], rematch: null, lastCrews: null, music: true, vol: 1, lite: false, n: 0, result: null };
    const phaseLater = (ms, f) => { const h = later(ms, f); G.timers.push(h); return h; };
    const clearPhase = () => { G.timers.forEach(cancel); G.timers = []; };
    const inArena = (p) => Math.hypot(p.x - AC[0], p.z - AC[1]) < A.r + 0.5 && p.y > CF - 45 && p.y < CF + 8;
    const crewOf = (x, z) => { const dx = x - AC[0], dz = z - AC[1]; return CREWS.find((c) => Math.sign(dx || 1e-6) === CREW_SIDE[c][0] && Math.sign(dz || 1e-6) === CREW_SIDE[c][1]); };
    const alive = () => Array.from(P.values()).filter((p) => p.st === "in");
    const crewAlive = (c) => (G.crews[c] || []).filter((id) => (P.get(id) || {}).st === "in").length;
    const CAP_TOP = A.perch_top * A.perch_s;

    function perchUp(pc, lit) {
      pc.up = true; glide(pc.g, "y", PERCH_LO, PERCH_HI, 1500, "easeOutBack");
      if (lit) { pc.lit = model("roost_perch_lit", S3(A.perch_s), pc.g);
        pc.pad = colModel("roost_perch_col", Object.assign({ "collision-interval": 100 }, S3(A.perch_s)), pc.g);
        on(pc.pad, "collisionstart", (e) => { const id = e.detail && e.detail.connectionId; if (id === undefined) return; const q = e.detail.position;
          if (q && typeof q.y === "number" && q.y < CAP_TOP * 0.8) return;          // touching the stalk is not roosting
          const p = pl(id); p.perch.set(pc.i, (p.perch.get(pc.i) || 0) + 1); p.roosted = now(); });
        on(pc.pad, "collisionend", (e) => { const id = e.detail && e.detail.connectionId; if (id === undefined) return; const p = pl(id); const n = (p.perch.get(pc.i) || 0) - 1; if (n > 0) p.perch.set(pc.i, n); else p.perch.delete(pc.i); p.roosted = now(); }); }
      else pc.pad = colModel("roost_perch_col", S3(A.perch_s), pc.g);
    }
    function perchDown(pc) {
      if (!pc.up) return; pc.up = false; glide(pc.g, "y", PERCH_HI, PERCH_LO, 1800, "easeInCubic");
      if (pc.lit) { pc.lit.remove(); pc.lit = null; }
      if (pc.pad) { pc.pad.remove(); pc.pad = null; P.forEach((p) => p.perch.delete(pc.i)); }
    }
    let floorDown = false;
    function floorDrop(down) {
      floorDown = down;
      PET.forEach((pt, k) => later(k * 60, () => glide(pt.g, "y", down ? PADY : PADY - 16, down ? PADY - 16 : PADY, down ? 1100 : 2600, down ? "easeInQuad" : "easeInOutSine")));
      if (down) PET.forEach((pt) => pt.col.setAttribute("y", "-400"));
      else later(2700, () => { if (!floorDown) PET.forEach((pt) => pt.col.setAttribute("y", "0")); });
    }
    function play() {
      stopGame(true);
      G.ph = "lobby"; G.n++; G.round = 0; G.elim = []; G.crews = {}; G.pts = {}; G.result = null;
      P.forEach((p) => { p.st = "none"; p.crew = null; p.pick = null; p.perch.clear(); mark(p, null); sign(p, null); });
      boardWord("wd_crews"); boardNum(null);
      return "ROOST RUSH - CREWS OPEN: STAND IN YOUR CREW'S QUARTER OF THE LILY PADS (RED FRONT-LEFT, TEAL FRONT-RIGHT, MUSTARD BACK-LEFT, CREAM BACK-RIGHT). THEN start";
    }
    function start() {
      if (G.ph !== "lobby") return G.ph === "idle" ? "OPEN THE CREWS FIRST (play) - OR rematch" : "ALREADY RUNNING";
      CREWS.forEach((c) => { G.crews[c] = []; G.pts[c] = 0; });
      P.forEach((p) => {
        let c = null;
        if (G.rematch) c = G.rematch[p.id] || null;
        else if (p.t && now() - p.t < 4000 && inArena(p)) c = p.pick || crewOf(p.x, p.z);
        if (!c) return;
        p.crew = c; p.st = "in"; G.crews[c].push(p.id); mark(p, c); sign(p, "wd_" + c, 3000);
      });
      G.rematch = null;
      const n = alive().length;
      if (!n) { return "NOBODY IS ON THE ARENA - STAND ON THE LILY PADS, THEN start"; }
      G.ph = "ready"; boardWord("wd_ready"); boardNum(null);
      [3, 2, 1].forEach((d, i) => phaseLater(i * 1000, () => { boardNum(d); sfx("ng_tick.mp3", AC[0], CF + 10, AC[1], 0.9); }));
      phaseLater(3000, roundStart);
      return "START - " + CREWS.map((c) => c.toUpperCase() + " " + G.crews[c].length).join(", ");
    }
    function roundStart() {
      G.round++; G.ph = "glyde";
      PERCH.forEach(perchDown);
      boardWord("wd_dance"); boardNum(alive().length);
      musicOn();
      const ms = GLYDE_MS[0] + rnd() * (GLYDE_MS[1] - GLYDE_MS[0]);
      phaseLater(ms, findPhase);
      hostMsg("ROUND " + G.round + " - GLYDE! (" + alive().length + " UP)");
    }
    function findPhase() {
      G.ph = "find"; musicOff();
      const n = alive().length, K = clamp(Math.ceil(n * 0.72 / CAP), 1, PERCH.length);
      const order = PERCH.slice().sort(() => rnd() - 0.5).slice(0, K);
      order.forEach((pc, i) => later(i * 70, () => { perchUp(pc, true); moths(pc.x, CF + 2, pc.z, 2); }));
      boardWord("wd_find"); boardNum(K);
      const W = Math.round(FIND_MS[0] + (FIND_MS[1] - FIND_MS[0]) * clamp((G.round - 1) / 6, 0, 1));
      for (let s = Math.ceil(W / 1000); s >= 1; s--) phaseLater(W - s * 1000, () => sfx("ng_tick.mp3", AC[0], CF + 10, AC[1], 0.7));
      phaseLater(W, dropPhase);
    }
    function dropPhase() {
      G.ph = "drop"; boardWord("wd_drop"); boardNum(null);
      const lit = PERCH.filter((pc) => pc.lit);
      const onRoost = (p) => p.perch.size > 0 || (p.t && now() - p.t < 1500 && p.y > CF + 0.9 && lit.some((pc) => Math.hypot(p.x - pc.x, p.z - pc.z) < A.perch_r));
      const out = [], safe = [];
      alive().forEach((p) => (onRoost(p) ? safe : out).push(p));
      floorDrop(true); sfx("ng_drop.mp3", AC[0], CF + 3, AC[1], 0.9);
      safe.forEach((p) => { p.safeN++; G.pts[p.crew] = (G.pts[p.crew] || 0) + 1; sign(p, "wd_safe", 3000); });
      out.forEach((p) => { p.st = "out"; mark(p, null); sign(p, "wd_out", 6000); });
      later(400, () => sfx("ng_safe.mp3", AC[0], CF + 3, AC[1], 0.6));
      CREWS.forEach((c) => { if ((G.crews[c] || []).length && !crewAlive(c) && !G.elim.includes(c)) G.elim.push(c); });
      const left = CREWS.filter((c) => crewAlive(c) > 0), started = CREWS.filter((c) => (G.crews[c] || []).length);
      hostMsg("DROP! ROUND " + G.round + ": " + safe.length + " SAFE, " + out.length + " OUT - " + left.map((c) => c.toUpperCase() + " " + crewAlive(c)).join(", "));
      phaseLater(EXIT_MS, () => {
        floorDrop(false); PERCH.forEach(perchDown);
        const one = started.length > 1 ? left.length <= 1 : alive().length <= 1;
        if (one || !left.length || G.round >= MAX_ROUNDS) phaseLater(2800, () => finish(!left.length ? "everyone dropped" : G.round >= MAX_ROUNDS ? "rounds" : "last crew"));
        else phaseLater(3200, roundStart);
      });
    }
    function finish(reason) {
      G.ph = "results"; musicOff();
      const played = CREWS.filter((c) => (G.crews[c] || []).length);
      const elimIdx = (c) => { const i = G.elim.indexOf(c); return i < 0 ? 99 : i; };
      const rank = played.slice().sort((a, b) => crewAlive(b) - crewAlive(a) || elimIdx(b) - elimIdx(a) || (G.pts[b] || 0) - (G.pts[a] || 0)).concat(CREWS.filter((c) => !played.includes(c)));
      G.result = rank;
      G.lastCrews = {}; played.forEach((c) => G.crews[c].forEach((id) => { G.lastCrews[id] = c; }));
      const crews = {}; CREWS.forEach((c) => { crews[c] = { players: (G.crews[c] || []).length, standing: crewAlive(c), points: G.pts[c] || 0 }; });
      emit({ type: "result", game: "roostrush", n: G.n, rank, crews, reason });
      if (played.length) { boardWord("wd_" + rank[0]); phaseLater(2500, () => boardWord("wd_wins")); } else boardWord("wd_draw");
      boardNum(null); sfx("ng_win.mp3", AC[0], CF + 10, AC[1], 0.9);
      for (let i = 0; i < 8; i++) later(i * 400, () => { const [x, z] = polar(rnd() * 360, 6 + rnd() * 18); moths(AC[0] + x, CF + 2 + rnd() * 4, AC[1] + z, 2); });
      P.forEach((p) => { if (p.st === "in") sign(p, "wd_wins", 6000); });
      hostMsg("ROOST RUSH RESULT: " + rank.map((c) => c.toUpperCase() + " " + crewAlive(c) + " UP / " + (G.pts[c] || 0) + " PTS").join(" > ") + " - " + reason.toUpperCase());
      phaseLater(15000, () => { G.ph = "idle"; boardWord("wd_roostrush"); P.forEach((p) => { if (p.st !== "none") { p.st = "none"; mark(p, null); } }); });
    }
    function stopGame(quiet) {
      clearPhase(); musicOff(); PERCH.forEach(perchDown);
      if (floorDown) floorDrop(false);
      G.ph = "idle"; P.forEach((p) => { p.st = "none"; mark(p, null); sign(p, null); p.perch.clear(); });
      boardWord("wd_roostrush"); boardNum(null);
      return quiet ? null : "ROOST RUSH STOPPED";
    }
    const RR = {
      onPos(p) {
        if (G.ph !== "lobby") return;
        if (G.rematch) { const c = G.rematch[p.id]; if (c) mark(p, c); return; }
        if (inArena(p) && p.y > CF - 1) { const c = crewOf(p.x, p.z); if (c !== p.pick) { p.pick = c; mark(p, c); } }
        else if (p.pick) { p.pick = null; mark(p, null); }
      },
    };
    every(1000, () => { if (G.ph === "lobby") { const n = {}; CREWS.forEach((c) => (n[c] = 0)); P.forEach((p) => { if (p.pick && now() - p.t < 4000) n[p.pick]++; }); boardNum(CREWS.reduce((s, c) => s + n[c], 0)); G.lobby = n; } });

    // ---------------------------------------------------------------- the host mushroom at the island's front edge (unlabelled)
    { const hp = el("m-prompt", Object.assign({ message: "Host code + command", placeholder: "code + command" }, D.hostAt), STAGE);
      model("roost_perch", S3(0.8), hp); on(hp, "prompt", (e) => command(e.detail && e.detail.value, e.detail && e.detail.connectionId)); }

    // ---------------------------------------------------------------- HOST COMMANDS
    function cmd(c, parts) {
      if (c === "play") return play();
      if (c === "start") return start();
      if (c === "stop") return stopGame();
      if (c === "end") { if (["glyde", "find", "drop", "ready"].indexOf(G.ph) < 0) return "NOT PLAYING"; clearPhase(); PERCH.forEach(perchDown); if (floorDown) floorDrop(false); finish("host"); return "ENDED BY THE HOST - RESULTS UP"; }
      if (c === "again") { if (G.ph === "glyde" || G.ph === "find" || G.ph === "drop") return "A GAME IS RUNNING - end IT FIRST"; return play(); }
      if (c === "rematch") { if (!G.lastCrews) return "NO CREWS TO REUSE YET"; const keep = G.lastCrews; play(); G.rematch = keep; phaseLater(4000, () => { if (G.ph === "lobby") hostMsg(start()); }); return "REMATCH - SAME CREWS, COUNTING IN"; }
      if (c === "teams") { try { G.rematch = JSON.parse(parts.slice(1).join(" ")); return "EVENT TEAMS LOADED (" + Object.keys(G.rematch).length + " PLAYERS) - play THEN start"; } catch (e) { return "teams {\"connectionId\":\"red\", ...}"; } }
      if (c === "rounds") { const v = Number(parts[1]); if (v > 0) MAX_ROUNDS = clamp(Math.round(v), 1, 30); return "ROOST RUSH: UP TO " + MAX_ROUNDS + " ROUNDS"; }
      if (c === "music") { const a = (parts[1] || "").toLowerCase();
        if (a === "off") { G.music = false; musicOff(); return "MUSIC OFF"; } if (a === "on") { G.music = true; if (G.ph === "glyde") musicOn(); return "MUSIC ON"; }
        if (a === "up" || a === "down") { G.vol = clamp(G.vol + (a === "up" ? 0.2 : -0.2), 0.2, 2); if (G.ph === "glyde") musicOn(); return "MUSIC " + Math.round(G.vol * 100) + "%"; }
        return "music on | off | up | down"; }
      if (c === "show") { return sing() ? "THE TREE SINGS" : "WAIT A MOMENT - IT IS STILL SINGING"; }
      if (c === "lite") { const a = String(parts[1] || "").toLowerCase(), want = a === "on" ? true : a === "off" ? false : !G.lite; if (want === G.lite) return "LITE MODE IS ALREADY " + (want ? "ON" : "OFF");
        G.lite = want; LITE_SET.forEach((g) => { if (want) { g._home = g.parentNode; if (g._home) g.remove(); } else if (g._home) { g._home.appendChild(g); g._home = null; } });
        return "LITE MODE " + (want ? "ON - THE CIRCLING MOTHS ARE REMOVED" : "OFF - EVERYTHING IS BACK"); }
      if (c === "refresh") { const p = STAGE.parentNode, nx = STAGE.nextSibling; STAGE.remove(); if (nx && nx.parentNode === p) p.insertBefore(STAGE, nx); else p.appendChild(STAGE); return "REFRESHED - THE SCENE IS RE-SENT TO EVERYONE"; }
      if (c === "lift") { const k = EV.stops.findIndex((s) => s[0] === (parts[1] || "").toLowerCase()); if (k < 0) return "lift " + EV.stops.map((s) => s[0]).join("|"); request(k); return "ELEVATOR CALLED TO " + EV.stops[k][0].toUpperCase(); }
      return null;
    }
    function game() {
      const crews = {}; CREWS.forEach((c) => { crews[c] = { n: (G.crews[c] || []).length, up: crewAlive(c), pts: G.pts[c] || 0 }; });
      return { ph: G.ph, round: G.round, maxRounds: MAX_ROUNDS, crews, lobby: G.ph === "lobby" ? G.lobby : null, rank: G.result, up: alive().length,
        elevator: EV.stops[E.at][0], liftBusy: E.busy, lit: BR.filter((b) => b.lit).length, lite: G.lite, music: G.music,
        inRooms: ZSET.r.size, inCave: ZSET.c.size, tracked: P.size };
    }
    function players() { return Array.from(P.values()).filter((p) => p.crew || p.pick).map((p) => [p.id, p.crew || p.pick || "", p.st, p.safeN]); }
    function left(id) { const p = P.get(id); if (!p) return; mark(p, null); sign(p, null); if (p.st === "in") p.st = "out"; ZKNOWN.delete(id); ZSET.r.delete(id); ZSET.c.delete(id);
      BR.forEach((b) => b.on.delete(id)); if (G.ph === "idle") P.delete(id); }
    function dispose() { clearPhase(); }
    return { command: cmd, game, players, left, dispose, skyFits, _test: { BR, E, request, sing, LAND, PET, PERCH, G, P, lid: () => lidOpen } };
  }
})();
</script>
